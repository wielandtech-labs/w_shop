# wielandtech-labs app build workflow — two-image monorepo variant.
#
# Adapted from w_homelab templates/app-repo: this repo builds TWO images
# (shop-api from backend/, shop-web from storefront/) that share one tag per
# event so environments stay in lockstep. Tag formats are homelab conventions:
#
#   main push    -> YYYYMMDD-HHMMSS-<shortsha>   (deploys to prod via Flux)
#   branch push  -> dev-YYYYMMDD-HHMMSS-<shortsha> (deploys to dev via Flux)
#   pull request -> pr-<number>-<shortsha>         (review apps)
#
# Do not "improve" these formats — Flux image automation and
# manage_review_app.py in wielandtech-labs/w_homelab parse them.

name: Docker

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  HOMELAB_REPO: wielandtech-labs/w_homelab

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    name: Compute shared image tag
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: homelab-dind
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      short_sha: ${{ steps.tag.outputs.short_sha }}
    steps:
      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"
            short_sha="${sha:0:7}"
            tag="pr-${{ github.event.pull_request.number }}-${short_sha}"
          else
            short_sha="${GITHUB_SHA:0:7}"
            stamp="$(date +%Y%m%d-%H%M%S)"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              tag="${stamp}-${short_sha}"
            else
              tag="dev-${stamp}-${short_sha}"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${tag}"

  build:
    name: Build and push ${{ matrix.app }}
    needs: tag
    runs-on: homelab-dind
    strategy:
      matrix:
        include:
          - app: shop-api
            context: backend
          - app: shop-web
            context: storefront
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx (remote buildkitd)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234
          driver-opts: |
            cacert=/etc/buildkit/certs/ca.crt
            cert=/etc/buildkit/certs/tls.crt
            key=/etc/buildkit/certs/tls.key

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/wielandtech-labs/${{ matrix.app }}:${{ needs.tag.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/wielandtech-labs/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=ghcr.io/wielandtech-labs/${{ matrix.app }}:buildcache,mode=max

  review-app-upsert:
    name: Deploy review apps
    needs: [tag, build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab-dind
    steps:
      - name: Dispatch review-app upserts
        env:
          TOKEN: ${{ secrets.HOMELAB_REVIEW_APP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Registry app names: shop-api (backend), shop (storefront)
          for app in shop-api shop; do
            payload="$(jq -n \
              --arg app "$app" \
              --arg action "upsert" \
              --arg pr_number "${{ github.event.pull_request.number }}" \
              --arg image_tag "${{ needs.tag.outputs.tag }}" \
              --arg short_sha "${{ needs.tag.outputs.short_sha }}" \
              --arg source_repo "${{ github.repository }}" \
              --arg source_pr_url "${{ github.event.pull_request.html_url }}" \
              '{event_type: "review-app", client_payload: {app: $app, action: $action, pr_number: $pr_number, image_tag: $image_tag, short_sha: $short_sha, source_repo: $source_repo, source_pr_url: $source_pr_url}}')"
            curl -sf -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${HOMELAB_REPO}/dispatches" \
              -d "$payload"
          done

  review-app-delete:
    name: Remove review apps
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab-dind
    steps:
      - name: Dispatch review-app deletes
        env:
          TOKEN: ${{ secrets.HOMELAB_REVIEW_APP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for app in shop-api shop; do
            payload="$(jq -n \
              --arg app "$app" \
              --arg action "delete" \
              --arg pr_number "${{ github.event.pull_request.number }}" \
              --arg source_repo "${{ github.repository }}" \
              --arg source_pr_url "${{ github.event.pull_request.html_url }}" \
              '{event_type: "review-app", client_payload: {app: $app, action: $action, pr_number: $pr_number, source_repo: $source_repo, source_pr_url: $source_pr_url}}')"
            curl -sf -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${HOMELAB_REPO}/dispatches" \
              -d "$payload"
          done
